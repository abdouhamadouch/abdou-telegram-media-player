name: Import upstream player and add Arabic commands

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'Sync upstream project and add Arabic aliases') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/antlis/tg-streaming-bot.git /tmp/tg-streaming-bot
          rsync -a --exclude='.git' /tmp/tg-streaming-bot/ ./
          python apply_arabic_aliases.py
      - name: Commit imported source and Arabic aliases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sync upstream project and add Arabic aliases"
          git push
